# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Publishing coordinates.
#
# These are the Maven Central identity. Both are plain Gradle properties, so a -P flag overrides
# them: jitpack.yml passes -Pgroup=com.github.Taimuur.Vividly -Pversion=<tag>, because JitPack
# resolves a multi-module build under com.github.<User>.<Repo>.
group=io.github.taimuur
version=0.1.0
