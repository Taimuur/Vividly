# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Publishing coordinates.
#
# JitPack resolves a multi-module build under com.github.<User>.<Repo>, and invokes Gradle with
# -Pversion=<tag> for the tag being built. Both values are plain Gradle properties, so a -P flag on
# the command line overrides what is set here; these are the defaults for a local
# publishToMavenLocal.
group=com.github.Taimuur.Vividly
version=0.1.0-SNAPSHOT
