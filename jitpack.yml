# JitPack build configuration.
#
# JitPack checks out the tag being requested, runs the commands below, and then serves whatever the
# build left in the local Maven repository. Publishing there is exactly what
# `publishToMavenLocal` does, so no JitPack-specific publishing setup is needed.
#
# Note: JitPack's free tier only builds PUBLIC repositories. If this repository is ever made
# private, JitPack will no longer be able to fetch it and builds will fail with a clone error.

jdk:
  - openjdk17

install:
  # The default group in gradle.properties is the Maven Central one (io.github.taimuur), so it is
  # overridden here: JitPack resolves a multi-module build under com.github.<User>.<Repo>.
  #
  # JitPack exposes the tag being built as $VERSION. -Pversion makes the published artifacts carry
  # that tag; the fallback keeps the command valid if the variable is ever unset, rather than
  # publishing an empty version.
  - >
    ./gradlew publishToMavenLocal
    -Pgroup=com.github.Taimuur.Vividly
    -Pversion=${VERSION:-0.1.0-SNAPSHOT}
    --no-daemon --stacktrace
